name: Hugo Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read Hugo version
        id: hugo
        run: |
          version="$(sed 's#^v##; s#/extended$##' .hvm)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Check Hugo build
        run: hugo --gc --minify --destination /tmp/hugo-check
