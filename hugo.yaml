# Hugo configuration file
title: indiegamedev.org

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

taxonomies:
  game_studio: game_studios
  game_tag: game_tags
  article_studio: article_studios
  news_studio: news_studios
  tutorial_studio: tutorial_studios
  tool_studio: tool_studios
  video_studio: video_studios
  articles_tag: articles_tags
  news_tag: news_tags
  tutorial_tag: tutorial_tags
  tool_tag: tool_tags
  video_tag: video_tags

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: News
      pageRef: /news
      weight: 1
    - name: Articles
      pageRef: /articles
      weight: 2
    - name: Tutorials
      pageRef: /tutorials
      weight: 3
    - name: Videos
      pageRef: /videos
      weight: 4
    - name: Games
      pageRef: /games
      weight: 5
    - name: Tools
      pageRef: /tools
      weight: 6
    - name: Developers
      pageRef: /devs
      weight: 7
    - name: Studios
      pageRef: /studios
      weight: 8

    - name: Contact
      url: "https://github.com/nonameentername"
      weight: 9
    - name: Search
      weight: 10
      params:
        type: search
    - name: GitHub
      weight: 11
      url: "https://github.com/indiegamedevs/indiegamedev.org"
      params:
        icon: github

#  sidebar:
#    - name: Links
#      params:
#        type: separator
#      weight: 1
#
#    - name: GitHub
#      url: "https://github.com/indiegamedevs/indiegamedev.org"
#      weight: 2
#
#    - name: Discord
#      url: "https://discord.gg/placeholder"
#      weight: 3

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/indiegamedevs/indiegamedev.org/edit/main/content"
